name: Averqun CI
on:
  push:
    branches: [main, feat/compiler-foundation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: cargo run -p averqun -- check examples/hello.avq
      - run: cargo run -p averqun -- run examples/hello.avq
      - run: cargo run -p averqun -- ir-run examples/hello.avq
      - name: Reject invalid programs
        run: |
          if cargo run -p averqun -- check tests/compile-fail/undefined.avq; then exit 1; fi
          if cargo run -p averqun -- check tests/compile-fail/type-mismatch.avq; then exit 1; fi
