name: NEXA CI
on:
  push:
    branches: [main, feat/compiler-foundation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: cargo run -p nexa -- run examples/hello.nexa
